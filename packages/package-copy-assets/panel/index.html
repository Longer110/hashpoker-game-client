    <div class="text">当前项目 svn 版本号</div>
    <ui-prop v-show=true name="svn 版本号 (自动获取)" tooltip="当前项目 svn 版本号">
        <ui-input class="flex-1" readonly="true" v-value="strSvnVersion"></ui-input>
    </ui-prop>

    <div class="text">{{strProjectVersionTitle}}</div>
    <ui-prop v-show=true name="版本号 (手动填写)" tooltip="构建发布时填写的版本号">
        <ui-input class="flex-1" v-value="strProjectVersion" v-on:confirm="onChangeVersion"></ui-input>
    </ui-prop>
    
    <div class="text" v-show="options.isMainBundle">主包会复制全部资源到汇总目录</div>
    <div class="text" v-show="!options.isMainBundle">非主包只复制子游戏资源到汇总目录</div>
    <ui-prop name="是否主包" tooltip="主包会复制全部资源，子包只复制子游戏资源">
        <div class="layout horizontal center flex-1 ">
            <ui-checkbox v-bind:checked="options.isMainBundle" v-on:change="onCheckMainBundle"></ui-checkbox>
        </div>
    </ui-prop>

    <div class="text">打包汇总目标目录</div>
    <ui-prop v-show=true name="汇总目录选择" tooltip="选择复制资源到哪个汇总目录">
        <ui-select v-on:change="onChangeTarget" v-value="curBuildTarget">
            <option value="build-sets">build-sets</option>
            <option value="build-live">build-live</option>
            <option value="build-app">build-app</option>
            <option value="build-lib">build-lib</option>
            <option value="build-club">build-club</option>
        </ui-select>
    </ui-prop>
